[project]
name = "nakhoda"
authors = [
    { name = "Nakhoda", email = "sajmustafa@hotmail.com"}
]
description = "AI-native analytics platform for Frappe and ERPNext"
requires-python = ">=3.10"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["license.txt"]
dynamic = ["version"]

# Engine substrate. All permissive; none of it is AGPL, so nothing here
# constrains the licence choice recorded in CONTRIBUTING.md.
#   ibis     Apache-2.0   operation grammar -> SQL
#   duckdb   MIT          local warehouse
#   sqlglot  MIT          dialect handling
#   pandas   BSD-3        result materialisation
#
# NOTE (2026-08-11): these are the *product's* pins. The gardatest dev bench
# currently holds ibis 10.5.0 / duckdb 1.3.2, pinned by the `insights` app
# installed alongside. Installing these versions into that env would break it.
# Phase 1 (semantic generator) needs none of them - it runs on frappe.get_meta()
# alone - so the dev bench installs nakhoda with --no-deps until Phase 0 starts,
# at which point the engine either gets its own bench or gardatest drops insights.
dependencies = [
    "ibis-framework[duckdb,mysql,postgres]~=11.0.0",
    "duckdb~=1.4.3",
    "sqlglot<28.0.0",
    "pandas~=2.3.3",
]

[project.urls]
Homepage = "https://github.com/Coale-Tech/nakhoda"
Repository = "https://github.com/Coale-Tech/nakhoda.git"
"Bug Reports" = "https://github.com/Coale-Tech/nakhoda/issues"

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# Deliberately NOT insights. Nakhoda is a competitor, not an extension (build plan §0).
[tool.bench.frappe-dependencies]
frappe = ">=15.0.0"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

# These apt dependencies will be installed from Ubuntu repositories when you host your app on Frappe Cloud
[deploy.dependencies.apt]
packages = []

[tool.ruff]
line-length = 110
target-version = "py310"
# Two exclusions, both because the content is evidence rather than source.
# semantic_bench/ is the research harness, vendored verbatim - its value is that it
# reproduces byte-identical (see its README), and only two edits were ever made to
# it: relocatable paths and an import guard. docs/ quotes Insights and Frappe source
# inside fences; ruff >=0.16 formats Markdown code blocks, so linting docs/ would
# silently rewrite quoted source and make the citations wrong.
exclude = ["nakhoda/tests/semantic_bench", "docs"]

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # "unused" imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # indentation contains tabs
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true

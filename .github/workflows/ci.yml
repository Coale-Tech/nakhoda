name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Invariant 11. Runs alone, first, and on every commit - its whole job is to fail
  # on the first copied file, not to audit a finished tree. Needs no site, no
  # database and no app install, so it reports in seconds rather than after a bench.
  clean-room:
    name: Clean room
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: nakhoda }

      # The corpus. Without an explicit checkout the gate has nothing to compare
      # against and would pass vacuously, which is worse than not running it -
      # setUpClass turns an empty corpus into a hard failure when CI is set.
      - uses: actions/checkout@v4
        with:
          repository: frappe/insights
          ref: develop
          path: corpus/insights
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - uses: actions/cache@v4
        with:
          path: ~/.cache/nakhoda
          key: shingles-${{ hashFiles('corpus/insights/**/*.py') }}

      - name: Gate
        working-directory: nakhoda
        env:
          NAKHODA_COPYLEFT_ROOTS: ${{ github.workspace }}/corpus/insights
        run: |
          python -m nakhoda.tests.clean_room
          python -m unittest nakhoda.tests.test_clean_room -v

  # Gate A. The research measured a text file; this proves the shipped generator
  # still produces it. Pinned to the ERPNext the artifact was derived from, because
  # a different release moves fields and the diff would measure ERPNext, not us.
  semantic:
    name: Semantic layer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: nakhoda }

      - uses: actions/checkout@v4
        with:
          repository: frappe/erpnext
          ref: v16.29.0
          path: erpnext
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      # No pip install: the generator imports nothing outside the standard library,
      # which is what lets this gate run in seconds against a bare checkout. The
      # one thing it borrows from Frappe - the fieldtype allow-list - is pinned by
      # `test_semantic_live.py` on a real bench instead.
      - name: Gate A
        working-directory: nakhoda
        env:
          SEMANTIC_BENCH_ERPNEXT: ${{ github.workspace }}/erpnext
        run: python -m unittest nakhoda.tests.test_semantic -v

  # Phase 8. The two build-plan gates: ML operations agree with the method
  # read from the jkm fork on synthetic frames, and the frontend subtraction
  # holds - no dedicated ML route, nav item, chart component or origin badge
  # anywhere in the tree (`docs/plan/12-build-plan.md` §Phase 8 gate index).
  # Bench-independent by construction: `engine/ml.py` never touches a
  # database or a permission, so a synthetic pandas frame is the whole input
  # this needs.
  ml-operations:
    name: ML operations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - run: pip install "pandas~=2.3.3" "scikit-learn~=1.7" "statsmodels~=0.14" "scipy~=1.16"

      - name: Gate
        run: |
          python -m unittest nakhoda.tests.test_ml -v
          python -m unittest nakhoda.tests.test_operations -v
          python -m unittest nakhoda.tests.test_no_ml_surface -v

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # Pinned. An unpinned linter turns someone else's release into your red
      # build - 0.16 started formatting Markdown code blocks, which would have
      # rewritten the source quoted in docs/.
      - run: pip install ruff==0.15.19
      - run: ruff check .
      - run: ruff format --check .
